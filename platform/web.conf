# Локальний вебсервер: Thing Models, UI, Ditto API тільки для читання
server {
    listen 80;

    location /twin/ {
        root /usr/share/nginx/html;
        types { application/tm+json jsonld; application/json json; }
    }

    location /ui/ {
        root /usr/share/nginx/html;
    }

    location /scene/ {
        root /usr/share/nginx/html;

        gzip on;
        gzip_types application/javascript application/json application/wasm;
    }

    location /scene/tiles/ {
        root /usr/share/nginx/html;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://nginx:80;
        proxy_set_header Authorization "Basic ZGl0dG86ZGl0dG8="; # ditto:ditto (demo)
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
